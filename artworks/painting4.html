<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AR Wall Painting</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .arjs-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        .loader-content h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .loader-content p {
            font-size: 1.1rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 15px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.8rem;
            text-align: center;
            z-index: 100;
        }
        #ar-scene {
            width: 100%;
            height: 100%;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Loader Screen -->
    <div class="arjs-loader" id="loadingScreen">
        <div class="loader-content">
            <h1>🖼️ AR Wall Painting</h1>
            <p>Starting camera...</p>
            <p>Please allow camera access when prompted</p>
            <div style="margin-top: 30px;">
                <div style="width: 40px; height: 40px; border: 4px solid #4dabf7; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            </div>
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene 
        id="ar-scene"
        vr-mode-ui="enabled: false"
        arjs='sourceType: webcam; detectionMode: mono; maxDetectionRate: 60;'
        renderer='antialias: true; alpha: true;'
        loading-screen="enabled: false"
    >
        <!-- Hit testing for surface placement -->
        <a-entity id="hit-testing">
            <!-- This will be populated with detected surfaces -->
        </a-entity>

        <!-- Camera -->
        <a-entity camera="active: true"></a-entity>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#BBB" intensity="0.5"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.5" position="-1 1 1"></a-light>
    </a-scene>

    <!-- Instructions -->
    <div class="instructions">
        <h3>🎯 How to Use:</h3>
        <ul style="list-style: none; padding: 0; margin: 10px 0;">
            <li>• Point camera at a flat wall or surface</li>
            <li>• Tap screen to place painting</li>
            <li>• Move phone to adjust position</li>
        </ul>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        🔍 Scanning for surfaces...
    </div>

    <script>
        // Global variables
        let sceneReady = false;
        let paintingPlaced = false;

        // Initialize when DOM loads
        document.addEventListener('DOMContentLoaded', function() {
            const scene = document.querySelector('a-scene');
            const loadingScreen = document.getElementById('loadingScreen');
            const statusBar = document.getElementById('statusBar');

            // Scene loaded
            scene.addEventListener('loaded', function() {
                console.log('Scene loaded');
                sceneReady = true;
                
                // Hide loading screen after delay
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 2000);
            });

            // Camera started
            scene.addEventListener('arjs-stream-started', function() {
                console.log('Camera started');
                statusBar.innerHTML = '✅ Camera active - point at a wall!';
            });

            // Camera error
            scene.addEventListener('arjs-error', function(event) {
                console.error('AR.js error:', event.detail);
                statusBar.innerHTML = '❌ Camera error - check permissions';
                showCameraError();
            });

            // Touch/click to place painting
            scene.addEventListener('click', function(event) {
                if (paintingPlaced) return;
                placePainting();
            });

            scene.addEventListener('touchstart', function(event) {
                if (paintingPlaced || event.touches.length > 1) return;
                placePainting();
            });

            // Handle iOS specific behavior
            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                // Prevent zoom
                document.addEventListener('gesturestart', function(e) {
                    e.preventDefault();
                });
            }
        });

        // Place painting function
        function placePainting() {
            if (paintingPlaced) return;
            
            const scene = document.querySelector('a-scene');
            paintingPlaced = true;
            
            // Create painting entity at camera position
            const painting = document.createElement('a-entity');
            painting.setAttribute('position', '0 0 -3'); // 3 meters in front
            painting.setAttribute('rotation', '0 0 0');
            painting.setAttribute('scale', '1 1 1');
            
            // Add painting plane
            const plane = document.createElement('a-plane');
            plane.setAttribute('width', '2.5');
            plane.setAttribute('height', '1.8');
            plane.setAttribute('material', {
                src: '#painting-texture',
                transparent: true,
                shader: 'flat'
            });
            
            // Add frame
            const frame = document.createElement('a-box');
            frame.setAttribute('width', '2.7');
            frame.setAttribute('height', '2');
            frame.setAttribute('depth', '0.1');
            frame.setAttribute('color', '#8B4513');
            frame.setAttribute('position', '0 0 0.05');
            
            // Add title
            const title = document.createElement('a-text');
            title.setAttribute('value', 'Your Artwork');
            title.setAttribute('position', '0 -1.2 0.06');
            title.setAttribute('align', 'center');
            title.setAttribute('color', '#ffffff');
            title.setAttribute('width', '4');
            
            // Build painting
            painting.appendChild(plane);
            painting.appendChild(frame);
            painting.appendChild(title);
            
            // Add to scene
            scene.appendChild(painting);
            
            // Update status
            document.getElementById('statusBar').innerHTML = '🎨 Painting placed! Move around to view.';
            
            console.log('Painting placed successfully');
        }

        // Show camera error
        function showCameraError() {
            const loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.innerHTML = `
                <div class="loader-content">
                    <h1>📷 Camera Access Needed</h1>
                    <p>To use AR features, please:</p>
                    <p><strong>1. Close other apps using camera</strong></p>
                    <p><strong>2. Refresh this page</strong></p>
                    <p><strong>3. Allow camera permissions</strong></p>
                    <button onclick="location.reload()" style="
                        margin-top: 30px;
                        padding: 15px 30px;
                        background: #007AFF;
                        color: white;
                        border: none;
                        border-radius: 12px;
                        font-size: 1.1rem;
                        font-weight: 600;
                        cursor: pointer;
                    ">🔄 Try Again</button>
                </div>
            `;
            loadingScreen.classList.remove('hidden');
        }

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>

    <!-- Your painting image -->
    <img id="painting-texture" 
         src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/800px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg" 
         style="display:none;" 
         crossorigin="anonymous">
</body>
</html>
