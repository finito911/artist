<!DOCTYPE html>
<html>
<head>
    <title>AR Paint - Image Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
        .instructions {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="instructions">
        Point camera at your reference image to see AR overlay
    </div>

    <a-scene 
        vr-mode-ui="enabled: false"
        arjs='sourceType: webcam; detectionMode: mono;'
        renderer="logarithmicDepthBuffer: true;"
        embedded>

        <!-- Image tracking - replace with your reference image -->
        <a-nft arjs-nft-marker-type="nft" 
               arjs-nft-marker-url="../images/reference-image-marker">
            <!-- This will stick to your reference image -->
            <a-entity 
                geometry="primitive: plane; width: 1; height: 1" 
                material="src: ../images/painting1.jpg; transparent: true; shader: flat"
                position="0 0 0">
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
