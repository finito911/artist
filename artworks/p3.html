<!DOCTYPE html>
<html>
<head>
    <title>AR Paint - HIRO Marker</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .info {
            position: fixed; 
            top: 10px; 
            left: 10px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 10px; 
            border-radius: 5px;
            z-index: 1000;
        }
        .marker-link {
            color: #4CAF50; 
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="info">
        <a href="https://arjs-cdn.s3.eu-west-3.amazonaws.com/three.js/data/images/HIRO.jpg" target="_blank" class="marker-link">
            Click to download HIRO marker
        </a>
        <br>Show marker to camera to see paint overlay
    </div>

    <a-scene 
        vr-mode-ui="enabled: false"
        arjs='sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'
        renderer="logarithmicDepthBuffer: true;"
        embedded>

        <a-marker preset="hiro">
            <a-entity 
                geometry="primitive: plane; width: 1; height: 1" 
                material="src: ../images/painting1.jpg; transparent: true"
                position="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
