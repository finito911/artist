<!DOCTYPE html>
<html>
<head>
    <title>AR Paint Preview - Back Camera</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .camera-selector {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="camera-selector">
        <label>Select Camera:</label>
        <select id="cameraSelect" onchange="switchCamera(this.value)">
            <option value="back">Back Camera</option>
            <option value="front">Front Camera</option>
        </select>
    </div>

    <a-scene>
        <!-- Camera entity -->
        <a-entity id="camera" camera="active: true" look-controls></a-entity>
        
        <!-- Virtual wall -->
        <a-box id="wall" position="0 1.5 -5" width="4" height="3" depth="0.1" 
               color="#ffffff" material="shader: flat"></a-box>
        
        <!-- UI Controls -->
        <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;">
            <button onclick="changeColor('#ff0000')">Red</button>
            <button onclick="changeColor('#00ff00')">Green</button>
            <button onclick="changeColor('#0000ff')">Blue</button>
            <button onclick="changeColor('#ffff00')">Yellow</button>
            <button onclick="clearWall()">Clear</button>
        </div>
    </a-scene>

    <script>
        let currentStream = null;

        // Initialize with back camera
        window.onload = function() {
            switchCamera('back');
        };

        async function switchCamera(cameraType) {
            try {
                // Stop current stream if exists
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                // Get camera constraints
                const constraints = {
                    video: {
                        facingMode: cameraType === 'back' ? 'environment' : 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                // Get new stream
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // Update A-Frame scene to use this stream
                const video = document.createElement('video');
                video.srcObject = currentStream;
                video.autoplay = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);

                console.log(`Switched to ${cameraType} camera`);
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                alert('Could not access camera. Please check permissions.');
            }
        }

        function changeColor(color) {
            document.getElementById('wall').setAttribute('color', color);
        }

        function clearWall() {
            document.getElementById('wall').setAttribute('color', '#ffffff');
        }
    </script>
</body>
</html>
