<!DOCTYPE html>
<html>
<head>
    <title>Real-time Paint Preview</title>
    <style>
        #videoContainer {
            position: relative;
            width: 640px;
            height: 480px;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlayCanvas" width="640" height="480"></canvas>
    </div>
    
    <div>
        <button onclick="applyPaint('#e74c3c')">Red</button>
        <button onclick="applyPaint('#3498db')">Blue</button>
        <button onclick="applyPaint('#2ecc71')">Green</button>
        <button onclick="clearPaint()">Clear</button>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('overlayCanvas');
        let ctx = canvas.getContext('2d');
        let currentPaintColor = null;

        // Access webcam
        navigator.mediaDevices.getUserMedia({video: true})
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    processFrame();
                };
            });

        function applyPaint(color) {
            currentPaintColor = color;
        }

        function clearPaint() {
            currentPaintColor = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function processFrame() {
            if (currentPaintColor) {
                // Simple overlay effect - in practice, you'd detect surfaces here
                ctx.fillStyle = currentPaintColor + '40'; // Semi-transparent
                ctx.fillRect(100, 100, 300, 200); // Simulated wall area
            }
            
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
