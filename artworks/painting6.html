<!DOCTYPE html>
<html>
<head>
    <title>Real-time Paint Preview - Back Camera</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
        }
        .color-btn {
            width: 50px;
            height: 50px;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
        }
        .camera-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlayCanvas"></canvas>
    </div>
    
    <div class="camera-control">
        <button onclick="switchToBackCamera()">Back Camera</button>
        <button onclick="switchToFrontCamera()">Front Camera</button>
    </div>
    
    <div class="controls">
        <div class="color-btn" style="background-color: #e74c3c;" onclick="setPaintColor('#e74c3c')"></div>
        <div class="color-btn" style="background-color: #3498db;" onclick="setPaintColor('#3498db')"></div>
        <div class="color-btn" style="background-color: #2ecc71;" onclick="setPaintColor('#2ecc71')"></div>
        <div class="color-btn" style="background-color: #f39c12;" onclick="setPaintColor('#f39c12')"></div>
        <div class="color-btn" style="background-color: #ffffff; border: 2px solid #333;" onclick="setPaintColor('#ffffff')"></div>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('overlayCanvas');
        let ctx = canvas.getContext('2d');
        let currentStream = null;
        let paintColor = null;
        let isPainting = false;
        let lastX = 0;
        let lastY = 0;

        // Initialize with back camera
        window.onload = function() {
            initBackCamera();
        };

        // Set up canvas dimensions when window loads
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        async function initBackCamera() {
            try {
                // Stop existing stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                // Request back camera
                const constraints = {
                    video: {
                        facingMode: 'environment', // This specifically requests the back camera
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                // Set canvas size after video loads
                video.onloadedmetadata = function() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };

                // Start processing frames
                video.addEventListener('play', startProcessing);
                
            } catch (error) {
                console.error('Error accessing back camera:', error);
                alert('Could not access back camera. Please ensure you\'re on a mobile device with a back camera.');
            }
        }

        function switchToBackCamera() {
            initBackCamera();
        }

        async function switchToFrontCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: 'user', // Front camera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
            } catch (error) {
                console.error('Error switching to front camera:', error);
            }
        }

        function setPaintColor(color) {
            paintColor = color;
        }

        function startProcessing() {
            if (video.paused || video.ended) return;
            
            // Draw video frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Apply paint effect if color is selected
            if (paintColor && paintColor !== '#ffffff') {
                // Simple overlay - in a full implementation, you'd detect walls/surfaces
                ctx.fillStyle = paintColor + '30'; // Semi-transparent
                // Paint over central area (simulating wall detection)
                ctx.fillRect(canvas.width * 0.2, canvas.height * 0.2, 
                           canvas.width * 0.6, canvas.height * 0.6);
            }
            
            requestAnimationFrame(startProcessing);
        }

        // Touch/mouse events for painting interaction
        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);

        function handleStart(e) {
            isPainting = true;
            [lastX, lastY] = getPosition(e);
        }

        function handleMove(e) {
            if (!isPainting) return;
            e.preventDefault();
            
            const [x, y] = getPosition(e);
            
            if (paintColor) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.strokeStyle = paintColor;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            }
            
            [lastX, lastY] = [x, y];
        }

        function getPosition(e) {
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            return [x, y];
        }

        // Cleanup on touch end/mouse up
        canvas.addEventListener('touchend', () => isPainting = false);
        canvas.addEventListener('mouseup', () => isPainting = false);
        canvas.addEventListener('mouseout', () => isPainting = false);
    </script>
</body>
</html>
