<!DOCTYPE html>
<html>
<head>
    <title>Simple AR Camera</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background:#000;">
    <video id="video" autoplay playsinline muted style="width:100vw; height:100vh; object-fit:cover;"></video>
    <button onclick="startCamera()" style="position:fixed; top:20px; left:20px; z-index:1000; padding:15px;">Start Back Camera</button>
    
    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment' // BACK CAMERA
                    }
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                console.error('Error:', err);
                alert('Could not access back camera. Make sure you are on a mobile device and have granted permissions.');
            }
        }
    </script>
</body>
</html>
